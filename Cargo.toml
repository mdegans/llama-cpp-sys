[package]
name = "llama-cpp-sys-3"
version = "0.7.0"
edition = "2021"
description = "llama.cpp bindings"
license = "MIT"
include = [
    "src/**/*",
    "build.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    # llama.cpp build system
    "external/llama.cpp/CMakeLists.txt",
    "external/llama.cpp/cmake/**/*",
    # llama library source
    "external/llama.cpp/src/**/*",
    "external/llama.cpp/include/**/*",
    # ggml library source and build
    "external/llama.cpp/ggml/**/*",
    # installed by cmake
    "external/llama.cpp/convert_hf_to_gguf.py",
    "tests/**/*",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"

[dev-dependencies]
rand = "0.8.5"

[features]
cuda = []
cuda_f16 = ["cuda"]
native = []
# TODO(mdegans): vulkan, kompute, clblast, mpi, CUDA on Windows, etc.
